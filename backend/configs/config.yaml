app:
  name: "IMChat"
  version: "0.0.1"
  env: "development"
  maxConnectionIdle: 
  machineId: 1
server:
  port: ":8081"
http:
  user_api_rate_limit:
    # 本地压测准备允许同一来源批量登录；其他部署环境应按需覆盖。
    rate_per_second: 500
    burst: 500
agent:
  room_summary_endpoint: "dl_container:50051"
database:
  mysql:
    dsn: "user:123456@tcp(mysql:3306)/IMChat?charset=utf8mb4&parseTime=True&loc=Local"
  redis:
    dsn: "redis://redis:6379/1?dial_timeout=5s&read_timeout=3s&pool_size=50"
jwt:
  secret: "U2FsdGVkX19anQGSRtiUwgRLpWV333jI4xjlCF32dek="
  access_expire_minutes: 150
  refresh_expire_hours: 168

security:
  allowed_origins: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:8080,http://127.0.0.1:8080,http://localhost:8081,http://127.0.0.1:8081"

ws:
  write_wait_seconds: 10
  pong_wait_seconds: 60
  ping_period_seconds: 50
  timer_interval_seconds: 30
  max_message_size: 5120
  max_message_send_buffer_size: 256
  inbound_worker_count: 4 # 每个连接最多并行处理 4 个请求，ACK 按 clientMsgId 关联。
  send_message_rate: 10
  send_message_burst: 20
  batch_max_messages: 64
  batch_max_bytes: 8192
  batch_linger_milliseconds: 20
  batch_ready_queue_size: 16
message:
  room_realtime_fanout_limit: 500
  large_room_notice_linger_milliseconds: 50
  large_room_notice_shard_count: 16
  max_text_runes: 4096
  max_width: 8192
  max_height: 8192
  max_video_ms: 86400000
  max_identifier_length: 128
  attachment_ttl_seconds: 1209600
  room_activity_window_seconds: 30
  room_activity_hold_seconds: 120 # 最后一次判定 ACTIVE 后保持拉模式，不影响 Redis 消息缓存的 10 分钟 TTL。
  room_activity_bucket_seconds: 5
  room_activity_key_ttl_seconds: 60
  # 阈值单位为统计窗口内的消息数 × 在线 WebSocket 会话数；6000/18000 保持约 200 个在线会话时原有 30/90 条消息的切换点。
  room_activity_warn_fanout_work: 6000
  room_activity_active_fanout_work: 18000
  room_member_state_ttl_seconds: 3600
  room_member_negative_ttl_seconds: 120
  history_default_limit: 20
  history_max_limit: 30
kafka:
  brokers:
    - "kafka:9092"
  topics:
    message: "im.message"
    read_message_committed: "im.read"
    friend_request_created: "im.friend"
    room_member_changed: "im.room"
    file_card_warmup: "im.file-card-warmup"

  consumer:
    group_id: "im-chat-consumer-group"
    version: "2.6.0"
    assignor: "range"   # range / roundrobin / sticky
    max_retries: 3
    worker_count: 16
    queue_size: 1024
    lease_stale_after_seconds: 10
    consume_retry_interval_seconds: 1
    dead_letter_suffix: ".dlq"

  producer:
    acks: "all"         # all / 1 / 0
    retries: 3
    batch_size: 16384
    linger_ms: 10
    compression: "snappy"
    claim_batch_size: 100
    poll_interval_seconds: 2
    stale_after_seconds: 30
    base_retry_wait_seconds: 2
    max_retries: 10

  partition:
    strategy: "conversation_hash"   # room_hash / user_hash / random
storage:
  minio:
    endpoint: "minio:9000"
    public_endpoint: "http://localhost:9000"
    region: "us-east-1"
    access_key_id: "minioadmin"
    secret_access_key: "minioadmin"
    bucket: "imchat"
    use_ssl: false
    cache_ttl_seconds: 600
    url_ttl_seconds: 3600
    multipartTTL: 86400
    part_url_ttl_seconds: 900
    direct_upload_url_ttl_seconds: 1800
    direct_upload_max_size_bytes: 8388608
    multipart_init_lock_ttl_seconds: 15
    multipart_complete_lock_ttl_seconds: 30
    max_file_size_bytes: 1073741824
    max_multipart_parts: 10000
    upload_rate: 1
    upload_burst: 5

file_cleanup:
  interval_seconds: 60
  batch_size: 50
  stale_after_seconds: 300
  base_retry_wait_seconds: 30
  operation_timeout_seconds: 30
  max_retries: 10
  orphan_after_seconds: 86400

cache:
  user_profile:
        ttl: 3600
        negative_ttl: 30
  attachment_access:
    # 访问 URL 缓存时间，略短于 storage.minio.url_ttl_seconds。
    ttl_seconds: 3570
  attachment_file_card:
    # 附件文件卡片缓存时间；实际不会超过附件自身的有效期。
    ttl_seconds: 86400
  room_unread_snapshot:
    # 用户进入房间前的未读摘要范围缓存时间。
    ttl_seconds: 120
  room_info:
    # 房间基础信息缓存；成员数在入群、退群提交后主动失效。
    ttl_seconds: 60
