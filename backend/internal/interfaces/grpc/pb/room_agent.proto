syntax = "proto3";

package room_agent.v1;

option go_package = "IM_backend/internal/interfaces/grpc/pb;roomagent";

service RoomAgentContextService {
  rpc VerifyRoomAccess(VerifyRoomAccessRequest)
  returns (VerifyRoomAccessResponse);

  rpc GetRoomUnreadMessages(GetRoomUnreadMessagesRequest)
  returns (stream GetRoomUnreadMessagesResponse);

  rpc SyncRoomMessages(SyncRoomMessagesRequest)
  returns (stream SyncRoomMessagesResponse);

  rpc SearchRoomMessages(SearchRoomMessagesRequest)
  returns (stream SearchRoomMessagesResponse);
}

message VerifyRoomAccessRequest {
  string room_id = 1;
}

message VerifyRoomAccessResponse {
  string thread_id = 1;
}

message GetRoomUnreadMessagesRequest {
  string room_id = 1;
  uint32 limit = 2;

  reserved 3;
  reserved "cursor";
}

message GetRoomUnreadMessagesResponse {
  repeated ChatMessage messages = 1;

  reserved 2;
  reserved "next_cursor";
}

message SyncRoomMessagesRequest {
  string room_id = 1;
  int64 after_seq = 2;
  uint32 limit = 3;
}

message SyncRoomMessagesResponse {
  repeated ChatMessage messages = 1;
}

message SearchRoomMessagesRequest {
  string room_id = 1;
  repeated MessageSeqRange ranges = 2;
  uint32 limit = 3;
}

message MessageSeqRange {
  int64 seq_start = 1;
  int64 seq_end = 2;
}

message SearchRoomMessagesResponse {
  repeated ChatMessage messages = 1;
}

message ChatMessage {
  string        message_id      = 1;
  string        conversation_id = 2;
  string        sender_id       = 3;
  int64         seq             = 5;
  MessageType   type            = 6;
  string        content         = 7;
  MessageStatus status          = 8;
  int64         send_time       = 9;
  string        sender_name     = 10;
}

enum MessageType {
  MESSAGE_TYPE_TEXT = 0;
}

enum MessageStatus {
  MESSAGE_STATUS_NORMAL   = 0;
  MESSAGE_STATUS_RECALLED = 1;
}
