syntax = "proto3";

package im.ws;

option go_package = "IM_backend/internal/transport/ws/pb;wspb";

message WsFrame {
  string op   = 1;
  bytes  data = 2;
}

message WsBatch {
  repeated WsFrame frames = 1;
}

message MessageReadAckReq {
  string message_id = 1;
  reserved 2;
}

message RoomEntryReq {
  string room_id = 1;
}

message ConnectionVisibilityReq {
  optional bool hidden = 1;
}

message MessageReq {
  string client_msg_id  = 1;
  int32  c_type         = 4;
  string content        = 5;
  string file_id        = 10;
  reserved 6, 7;
  string sticker_id     = 17;
  string pack_id        = 18;
  string conversation_id = 19;
}

message MessageAck {
  string client_msg_id = 1;
  string message_id    = 2;
  string status        = 3;
  string extra         = 4;
  int64  send_time     = 5;
  string conversation_id = 6;
  int64  seq               = 7;
  string attachment_id    = 8;
}

message RoomMessageNotice {
  string conversation_id = 1;
  string message_id      = 2;
  int64  seq             = 3;
}

message MessageReadAckEvent {
  string user_id         = 1;
  string conversation_id = 2;
  int64  last_read_seq   = 3;
  int32  conv_type       = 4;
  reserved 5;
  string avatar          = 6;
}

message MessageEvent {
  string message_id      = 1;
  string conversation_id = 2;
  string sender_id       = 3;
  int64  seq             = 5;
  int32  c_type          = 7;
  string content         = 8;
  int64  send_time       = 9;
  string client_msg_id   = 11;
  int32  status          = 14;
  string attachment_id   = 25;

  // 路由、用户展示以及媒体子表字段不属于消息推送本体。
  reserved 4, 6, 10, 12, 13, 18 to 24;
}
