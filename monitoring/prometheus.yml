global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: kafka-exporter
    scrape_interval: 5s
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: linkchat-backend
    metrics_path: /metrics
    static_configs:
      # 本轮后端直接运行在开发容器中；使用 Compose backend 服务时改为 backend:8081。
      - targets: ["linux:8081"]
